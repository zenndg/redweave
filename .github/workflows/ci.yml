# Repeats the pre-push gates on GitHub (questions 43 to 47 in _docs/perguntas/fase-1-sem-fio.md).
# Actions are pinned by commit SHA, with the tag in a comment (question 44).
name: CI

on:
  push:
    branches: [develop, homolog, main, 'release/**']
  pull_request:
    branches: [develop, homolog, main, 'release/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Check
        run: make check

      - name: GameTests
        run: make gametest

      - name: Generated files
        run: make check-generated

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            build/gametest.log
            build/reports/
          if-no-files-found: ignore

  secrets:
    name: Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: make setup

      - name: Scan the history
        run: make scan-secrets
