plugins {
    id 'java-library'
    id 'jacoco'
    id 'checkstyle'
    id 'com.diffplug.spotless'
    id 'net.neoforged.moddev'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    // Test tooling only lives on Maven Central, so a NeoForged Maven outage must not break the build.
    exclusiveContent {
        forRepository {
            mavenCentral()
        }
        filter {
            includeGroup('org.jacoco')
            includeGroup('org.ow2.asm')
            includeGroup('com.tngtech.archunit')
            includeGroupAndSubgroups('org.junit')
        }
    }

    mavenCentral()
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('.cache/**')
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Holds what only the client runs load, such as Jade when it arrives. The game looks for mods on
// the classpath of the run, so the server and the GameTests prove the mod opens without them.
sourceSets {
    clientRun
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            sourceSet = sourceSets.clientRun
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            // Keeps a config edited by hand in run/ from changing the test results.
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            // This run also starts as a client, so it loads the same mods.
            sourceSet = sourceSets.clientRun
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    clientRunRuntimeClasspath.extendsFrom runtimeClasspath
}

dependencies {
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "com.tngtech.archunit:archunit-junit5:${archunit_version}"
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

def modPath = project.mod_group_id.replace('.', '/')

tasks.named('jar', Jar) {
    from('LICENSE')
    from('COPYING')
    // Only the development runs use these, and they read the classes directly, not the jar.
    exclude "${modPath}/gametest/**", "${modPath}/datagen/**", "data/${mod_id}/structure/**"
    includeEmptyDirs = false
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    finalizedBy 'jacocoTestReport'
}

jacoco {
    toolVersion = project.jacoco_version
}

// Coverage targets the pure Java code, the domain and the application (rule 30): the rest is
// validated by GameTests and a manual script, which JaCoCo does not measure.
def coveredClasses = sourceSets.main.output.asFileTree.matching {
    include "${modPath}/domain/**"
    include "${modPath}/application/**"
}

tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn 'test'
    classDirectories.setFrom(coveredClasses)
    reports {
        html.required = true
        xml.required = true
    }
}

tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification) {
    dependsOn 'test'
    classDirectories.setFrom(coveredClasses)
    violationRules {
        rule {
            limit {
                minimum = 0.85
            }
            limit {
                counter = 'BRANCH'
                minimum = 0.85
            }
        }
    }
}

tasks.named('check') {
    dependsOn 'jacocoTestCoverageVerification'
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        googleJavaFormat(project.google_java_format_version)
        removeUnusedImports()
    }
}

checkstyle {
    toolVersion = project.checkstyle_version
    maxWarnings = 0
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
